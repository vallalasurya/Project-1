<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #b8c4d6;
      --panel: rgba(10, 16, 30, 0.72);
      --panel-border: rgba(255, 255, 255, 0.16);
      --teal: #37e6c4;
      --rose: #ff6a9c;
      --amber: #ffd166;
      --blue: #6aa8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 18%, rgba(55, 230, 196, 0.28), transparent 34%),
        radial-gradient(circle at 82% 24%, rgba(255, 106, 156, 0.24), transparent 32%),
        linear-gradient(135deg, #07111f 0%, #121b2c 48%, #261529 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent 82%);
    }

    .stage {
      width: min(92vw, 860px);
      padding: 28px;
      position: relative;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 430px;
      padding: clamp(34px, 6vw, 70px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.2), transparent 24%),
        linear-gradient(315deg, rgba(55, 230, 196, 0.16), transparent 42%);
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 28px var(--amber);
      animation: float 6s ease-in-out infinite;
    }

    .spark.one {
      right: 12%;
      top: 18%;
    }

    .spark.two {
      left: 11%;
      bottom: 20%;
      width: 9px;
      height: 9px;
      background: var(--teal);
      box-shadow: 0 0 24px var(--teal);
      animation-delay: -2s;
    }

    .spark.three {
      right: 23%;
      bottom: 15%;
      width: 7px;
      height: 7px;
      background: var(--rose);
      box-shadow: 0 0 22px var(--rose);
      animation-delay: -4s;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 22px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      color: var(--teal);
      background: rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 7.8rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--teal), var(--blue), var(--rose), var(--amber));
      background-clip: text;
      -webkit-background-clip: text;
    }

    p {
      max-width: 540px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.7;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      color: #06111f;
      background: var(--teal);
      box-shadow: 0 12px 32px rgba(55, 230, 196, 0.28);
      font-weight: 800;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 38px rgba(55, 230, 196, 0.36);
    }

    .ghost {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(18px, -22px, 0) scale(1.4);
      }
    }

    @media (max-width: 560px) {
      body {
        overflow: auto;
      }

      .stage {
        padding: 18px;
      }

      .card {
        min-height: auto;
      }

      .button-row {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Hello World page">
    <section class="card">
      <div class="spark one"></div>
      <div class="spark two"></div>
      <div class="spark three"></div>

      <div class="content">
        <p class="eyebrow">First page, big energy</p>
        <h1>Hello <span>World</span></h1>
        <p>
          A tiny HTML page dressed up with glassy depth, glowing color, and a little motion.
          Simple at heart, fancy on arrival.
        </p>
        <div class="button-row" aria-label="Page actions">
          <a href="#" onclick="alert('Hello right back!'); return false;">Say Hello</a>
          <a class="ghost" href="#" onclick="document.body.classList.toggle('awake'); return false;">Shine On</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
